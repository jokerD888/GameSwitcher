name: Windows safety checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-build.txt
      - run: python -m unittest discover -s tests -v
      - run: python main.py --self-test
      - run: python tests/window_integration.py
      - run: python -m PyInstaller GameSwitcher.spec --noconfirm
      - name: Check packaged native UI
        shell: pwsh
        run: |
          $fixture = Start-Process -FilePath ./dist/GameSwitcher.exe -ArgumentList '--self-test', 'packaged-smoke.json' -WindowStyle Hidden -Wait -PassThru
          if ($fixture.ExitCode -ne 0) { throw "Packaged self-test failed: $($fixture.ExitCode)" }
          $report = Get-Content packaged-smoke.json -Raw | ConvertFrom-Json
          if (-not $report.ok) { throw 'Packaged self-test did not confirm success' }
